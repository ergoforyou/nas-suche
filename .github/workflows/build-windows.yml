name: Windows-Build (DiktierFlow-Setup.exe)

on:
  push:
    paths:
      - "diktierflow/**"
      - "packaging/**"
      - "requirements.txt"
      - "run_diktierflow.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Symbol erzeugen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python packaging/make_icon.py

      - name: EXE bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name DiktierFlow
          --icon packaging/diktierflow.ico
          --collect-submodules pynput --collect-submodules pystray
          --collect-all uiautomation --collect-all sounddevice
          --collect-all faster_whisper --collect-all ctranslate2 --collect-binaries onnxruntime
          --copy-metadata anthropic --copy-metadata openai
          run_diktierflow.py

      - name: Prüfen, ob die EXE vollständig ist (Selbsttest ohne Rückfragen)
        shell: pwsh
        run: |
          $env:DIKTIERFLOW_SELFTEST_OUT = "$PWD\selftest.txt"
          $env:DIKTIERFLOW_HOME = "$PWD\testhome"
          $p = Start-Process dist\DiktierFlow\DiktierFlow.exe -ArgumentList "--selbsttest" -PassThru -Wait
          Get-Content selftest.txt
          $libs = (Get-Content selftest.txt -Raw) -split "2\) API" | Select-Object -First 1
          if ($libs -match "FEHLER") { Write-Error "In der EXE fehlen Bibliotheken"; exit 1 }

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.1.${{ github.run_number }} packaging\diktierflow.iss
          Compress-Archive -Path dist\DiktierFlow\* -DestinationPath dist\DiktierFlow-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DiktierFlow-Windows
          path: |
            dist/DiktierFlow-Setup.exe
            dist/DiktierFlow-portable.zip

      - name: Als Download veröffentlichen (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DiktierFlow 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            **DiktierFlow-Setup.exe** herunterladen und doppelklicken (keine Administratorrechte nötig).
            Danach im Startmenü „DiktierFlow“ starten; beim ersten Start die API-Schlüssel eintragen.
            „DiktierFlow Selbsttest“ im Startmenü prüft Mikrofon, Schlüssel, Tasten und Einfügen.

            Alternativ ohne Installation: DiktierFlow-portable.zip entpacken und DiktierFlow.exe starten.
          files: |
            dist/DiktierFlow-Setup.exe
            dist/DiktierFlow-portable.zip
