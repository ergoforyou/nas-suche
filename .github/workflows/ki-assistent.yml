name: KI-Assistent

on:
  push:
    branches:
      - '**'
    paths:
      - 'ki-assistent/**'
      - '.github/workflows/ki-assistent.yml'
    tags:
      - 'ki-assistent-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ki-assistent

jobs:
  sprachtest:
    name: Sprachkette testen (Piper → Whisper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ki-assistent/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  windows:
    name: Windows-Programm bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ki-assistent/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: App-Start prüfen
        run: npx electron . --smoke-test
      - name: Installer und portable .exe bauen
        run: npx electron-builder --win portable nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: KI-Assistent-Windows
          path: ki-assistent/release/*.exe
          if-no-files-found: error
      - name: Release veröffentlichen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/ki-assistent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ki-assistent/release/*.exe
