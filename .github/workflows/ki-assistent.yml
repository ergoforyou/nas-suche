name: KI-Assistent

on:
  push:
    branches:
      - '**'
    paths:
      - 'ki-assistent/**'
      - '.github/workflows/ki-assistent.yml'
    tags:
      - 'ki-assistent-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ki-assistent

jobs:
  sprachtest:
    name: Sprachkette testen (Piper → Whisper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ki-assistent/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Android-Oberfläche prüfen
        run: node build.mjs --mobile && node test/mobile.mjs

  android:
    name: Android-App bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ki-assistent/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node build.mjs --mobile
      - run: npx cap add android
      - name: Mikrofon-Recht, WLAN-Zugriff und Version eintragen
        run: node scripts/android-patch.mjs
      - run: npx cap sync android
      - name: APK bauen
        working-directory: ki-assistent/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK benennen
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-android/KI-Assistent-Beta-Android-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KI-Assistent-Beta-Android
          path: ki-assistent/release-android/*.apk

  android-test:
    name: Android-App im Emulator prüfen
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: KI-Assistent-Beta-Android
          path: ki-assistent/apk
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App installieren, starten und prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ki-assistent
          script: node test/android-emulator.mjs "$(ls apk/*.apk | head -1)"

  windows:
    name: Windows-Programm bauen
    runs-on: windows-latest
    env:
      # Beta-Linie: nur die Cloud-Ausgabe, als eigenes Programm „KI-Assistent Cloud Beta“ (eigener Datenordner)
      BETA: ${{ contains(github.ref, 'ki-assistent-beta') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ki-assistent/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: App-Start prüfen (Cloud-Ausgabe)
        run: npx electron . --smoke-test
      - name: App-Start prüfen (lokale Ausgabe)
        run: npx electron . --smoke-test
        env:
          KI_EDITION: lokal
      - name: Lokale Ausgabe bauen
        if: env.BETA != '1'
        shell: bash
        run: >
          npx electron-builder --win portable nsis --publish never
          -c.extraMetadata.edition=lokal -c.productName=KI-Assistent -c.appId=de.ergoforyou.kiassistent
          -c.directories.output=release/lokal
          '-c.nsis.artifactName=KI-Assistent-${version}-Setup.${ext}'
          '-c.portable.artifactName=KI-Assistent-${version}-portable.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Cloud-Ausgabe bauen
        if: env.BETA != '1'
        shell: bash
        run: >
          npx electron-builder --win portable nsis --publish never
          -c.extraMetadata.edition=cloud '-c.productName=KI-Assistent Cloud' -c.appId=de.ergoforyou.kiassistent.cloud
          -c.directories.output=release/cloud
          '-c.nsis.artifactName=KI-Assistent-Cloud-${version}-Setup.${ext}'
          '-c.portable.artifactName=KI-Assistent-Cloud-${version}-portable.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Cloud-Beta bauen
        if: env.BETA == '1'
        shell: bash
        run: >
          npx electron-builder --win portable nsis --publish never
          -c.extraMetadata.edition=cloud -c.extraMetadata.kanal=beta
          '-c.productName=KI-Assistent Cloud Beta' -c.appId=de.ergoforyou.kiassistent.cloud.beta
          -c.directories.output=release/cloud
          '-c.nsis.artifactName=KI-Assistent-Cloud-Beta-${version}-Setup.${ext}'
          '-c.portable.artifactName=KI-Assistent-Cloud-Beta-${version}-portable.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Paketinhalt prüfen
        shell: bash
        run: |
          if [ "$BETA" = "1" ]; then node test/check-package.mjs cloud; else node test/check-package.mjs lokal && node test/check-package.mjs cloud; fi
      - uses: actions/upload-artifact@v4
        if: env.BETA != '1'
        with:
          name: KI-Assistent-lokal
          path: |
            ki-assistent/release/lokal/*.exe
            ki-assistent/tts-server/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BETA == '1' && 'KI-Assistent-Cloud-Beta' || 'KI-Assistent-Cloud' }}
          path: |
            ki-assistent/release/cloud/*.exe
            ki-assistent/tts-server/*
          if-no-files-found: error
      - name: Release veröffentlichen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/ki-assistent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ki-assistent/release/lokal/*.exe
            ki-assistent/release/cloud/*.exe
