services:
  wa:
    build: .
    image: wa-hubspot:latest
    container_name: wa-hubspot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Nur lokal auf der NAS erreichbar – nach außen geht es ausschließlich über den
    # DSM-Reverse-Proxy mit HTTPS (siehe README).
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
