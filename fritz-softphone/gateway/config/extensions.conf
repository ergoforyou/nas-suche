[general]
static = yes
writeprotect = yes

; Anrufe von der FRITZ!Box -> Browser
[from-fritzbox]
exten => incoming,1,NoOp(Eingehender Anruf von ${CALLERID(all)})
 same => n,Set(__TRANSFER_CONTEXT=from-webphone)
 same => n,Dial(PJSIP/${WEBPHONE_USER},,)
 same => n,Hangup()
; Falls die FRITZ!Box eine andere Zielkennung schickt
exten => _[+*#0-9a-zA-Z].,1,Goto(incoming,1)

; Anrufe vom Browser -> FRITZ!Box (inkl. *09 Heranholen, **-Interne Nummern)
; Weiterleiten/Vermitteln (SIP REFER) landet ebenfalls hier.
[from-webphone]
exten => _[+*#0-9].,1,NoOp(Ausgehend: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@fritzbox,,)
 same => n,Hangup()
