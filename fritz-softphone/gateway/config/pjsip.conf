[global]
type = global
; Erst nach Benutzername zuordnen (Browser), dann nach IP (FRITZ!Box)
endpoint_identifier_order = username,ip,anonymous
user_agent = Fritz-Browser-Gateway

; =====================================================================
;  Seite 1: FRITZ!Box  (das Gateway meldet sich dort als "IP-Telefon" an)
; =====================================================================
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:${SIP_PORT}

[fritzbox-auth]
type = auth
auth_type = userpass
username = ${FRITZ_SIP_USER}
password = ${FRITZ_SIP_PASSWORD}

[fritzbox-reg]
type = registration
transport = transport-udp
outbound_auth = fritzbox-auth
server_uri = sip:${FRITZBOX_HOST}
client_uri = sip:${FRITZ_SIP_USER}@${FRITZBOX_HOST}
contact_user = incoming
expiration = 300
retry_interval = 20
forbidden_retry_interval = 60
max_retries = 100000
line = yes
endpoint = fritzbox

[fritzbox]
type = aor
contact = sip:${FRITZBOX_HOST}
qualify_frequency = 60

[fritzbox]
type = endpoint
transport = transport-udp
context = from-fritzbox
disallow = all
allow = g722,alaw,ulaw
outbound_auth = fritzbox-auth
aors = fritzbox
from_user = ${FRITZ_SIP_USER}
from_domain = ${FRITZBOX_HOST}
direct_media = no
dtmf_mode = rfc4733
rtp_symmetric = yes
timers = no

[fritzbox]
type = identify
endpoint = fritzbox
match = ${FRITZBOX_HOST}

; =====================================================================
;  Seite 2: Chrome-Erweiterung  (WebRTC über WebSocket)
; =====================================================================
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

[${WEBPHONE_USER}]
type = auth
auth_type = userpass
username = ${WEBPHONE_USER}
password = ${WEBPHONE_PASSWORD}

[${WEBPHONE_USER}]
type = aor
max_contacts = 3
remove_existing = yes
remove_unavailable = yes
qualify_frequency = 30

[${WEBPHONE_USER}]
type = endpoint
context = from-webphone
transport = transport-ws
webrtc = yes
dtls_auto_generate_cert = yes
disallow = all
allow = g722,alaw,ulaw
auth = ${WEBPHONE_USER}
aors = ${WEBPHONE_USER}
direct_media = no
allow_transfer = yes
timers = no
