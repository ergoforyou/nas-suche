[project]
name = "agentur-pdf"
version = "0.1.0"
description = "Agentur-PDF – lokaler Dienst (PDF-Kern, OCR, Konvertierung)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24,<2",  # 2.0 ändert u. a. das Umbenennen von Formularfeldern – erst prüfen
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10",
    "pillow-heif>=0.16",
    "olefile>=0.46",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "spylls>=0.1.7",
]

[project.optional-dependencies]
windows = ["pywebview>=5.0"]
test = ["pytest>=8", "httpx>=0.27", "python-docx>=1.1", "openpyxl>=3.1", "tzdata>=2024.1"]

[project.scripts]
agentur-pdf = "agentur_pdf.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["leistung: Leistungstests (Abnahmekriterium T7)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentur_pdf*"]
