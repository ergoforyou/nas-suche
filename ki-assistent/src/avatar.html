<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'" />
  <title>Avatar</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { width: 100%; height: 100%; display: block; }
    .pill {
      position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
      background: rgba(10, 12, 16, .78); color: #e8eaef; border: 1px solid #323743;
      font: 12px "Segoe UI", system-ui, sans-serif; padding: 2px 10px; border-radius: 999px; white-space: nowrap;
      pointer-events: none;
    }
    .pill.listening { border-color: #e0605b; }
    .pill[hidden] { display: none; }
    /* Knöpfe an der Figur: erscheinen, wenn die Maus auf der Figur ist */
    .ctl { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 8px;
           opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 6; }
    .ctl.show { opacity: 1; pointer-events: auto; }
    .ctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); cursor: pointer;
                  background: rgba(16,20,28,.82); color: #fff; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .ctl button:hover { background: rgba(61,123,224,.9); }
    .ctl button.on { background: #3d7be0; }
    .ctl button[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="pill" class="pill" hidden></div>
  <div id="ctl" class="ctl">
    <button id="ctlLive" title="Live-Gespräch an/aus (Strg+Alt+L)">📞</button>
    <button id="ctlStop" title="Sprachausgabe stoppen (Strg+Alt+S)" hidden>⏹</button>
  </div>
</body>
</html>
